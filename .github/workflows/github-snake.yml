
name: Generate GitHub Snake

on:
  schedule:
    # Run every day at midnight UTC
    - cron: "0 0 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

  # Run whenever this workflow file is updated
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # Generate the snake animation from GitHub contribution graph
      - name: Generate GitHub Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake.gif?color_snake=#39d353&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Publish generated files to the output branch
      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

