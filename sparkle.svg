<svg width="600" height="140" viewBox="0 0 600 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF77E9"/>
      <stop offset="50%" stop-color="#FF2D8D"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70E5FF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="neonGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5A5"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF8C00"/>
    </linearGradient>
  </defs>

  <g transform="translate(40, 20)">
    <!-- Star 1: Pink Diamond Sparkle -->
    <g transform="translate(60, 45)">
      <path d="M0 -22L6 -6L22 0L6 6L0 22L-6 6L-22 0L-6 -6L0 -22Z" fill="url(#neonPink)"/>
      <circle r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Star 2: Cyan Sparkle -->
    <g transform="translate(160, 25)">
      <path d="M0 -18L5 -5L18 0L5 5L0 18L-5 5L-18 0L-5 -5L0 -18Z" fill="url(#neonCyan)"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>

    <!-- Star 3: Large Center Gold Sparkle -->
    <g transform="translate(260, 50)">
      <path d="M0 -26L7 -7L26 0L7 7L0 26L-7 7L-26 0L-7 -7L0 -26Z" fill="url(#neonGold)"/>
      <circle r="4" fill="#FFFFFF"/>
    </g>

    <!-- Star 4: Pink Sparkle -->
    <g transform="translate(360, 30)">
      <path d="M0 -20L6 -6L20 0L6 6L0 20L-6 6L-20 0L-6 -6L0 -20Z" fill="url(#neonPink)"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>

    <!-- Star 5: Cyan Sparkle -->
    <g transform="translate(460, 55)">
      <path d="M0 -18L5 -5L18 0L5 5L0 18L-5 5L-18 0L-5 -5L0 -18Z" fill="url(#neonCyan)"/>
      <circle r="3" fill="#FFFFFF"/>
    </g>

    <!-- Small accent dots -->
    <circle cx="110" cy="70" r="3" fill="#FF2D8D"/>
    <circle cx="210" cy="20" r="3.5" fill="#00D2FF"/>
    <circle cx="310" cy="75" r="3" fill="#FFD700"/>
    <circle cx="410" cy="15" r="3.5" fill="#A855F7"/>
  </g>
</svg>
